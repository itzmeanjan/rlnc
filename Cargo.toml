[package]
name = "rlnc"
version = "0.8.6"
edition = "2024"
resolver = "3"
rust-version = "1.89.0"
authors = ["Anjan Roy <hello@itzmeanjan.in>"]
description = "Random Linear Network Coding"
readme = "README.md"
repository = "https://github.com/itzmeanjan/rlnc.git"
license = "BSD-3-Clause"
keywords = [
    "rlnc",
    "network-coding",
    "erasure-coding",
    "fountain-codes",
    "data-transmission",
]
categories = ["network-programming", "encoding", "algorithms"]


[dependencies]
rand = "=0.9.2"
rayon = { version = "=1.10.0", optional = true }

[target.'cfg(target_family = "wasm")'.dev-dependencies]
criterion = { version = "=0.7.0", features = [
    "html_reports",
], default-features = false }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
criterion = { version = "=0.7.0", features = ["html_reports"] }

[features]
parallel = ["dep:rayon"]

[[bench]]
name = "full_rlnc_encoder"
harness = false

[[bench]]
name = "full_rlnc_recoder"
harness = false

[[bench]]
name = "full_rlnc_decoder"
harness = false

[profile.optimized]
inherits = "release"
codegen-units = 1
lto = true
panic = "abort"
opt-level = 3

[profile.test-release]
inherits = "release"
debug = true
debug-assertions = true
overflow-checks = true
opt-level = 3
